name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Astro 7.x requires >=22.23.4 and the v22 line on this runner lagged
          # behind it, which failed the build (see run 40136532038). Pin the LTS
          # line that satisfies it and matches local dev.
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-site
        run: npm ci --prefer-offline

      - name: Build
        working-directory: portfolio-site
        run: npm run build

      # This repo deploys through Replit (whose Deployment pane builds from
      # source), so CI is a gate, not a publisher — keep the artifact as a
      # plain download rather than a garble of the GitHub Pages handoff.
      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: portfolio-site/dist
          retention-days: 14